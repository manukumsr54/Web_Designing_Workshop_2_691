<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar</title>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

.top-bar{
    text-align:center;
    padding:8px;
    background:#f5f5f5;
    font-size:14px;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#111;
    padding:12px 40px;
}

.logo img{
    width:60px;
}

.nav-links{
    list-style:none;
    display:flex;
    gap:25px;
}

.nav-links a{
    text-decoration:none;
    color:white;
    font-size:16px;
    font-weight:500;
}

.nav-links a:hover{
    color:#ccc;
}

.nav-icons{
    color:white;
    display:flex;
    gap:20px;
    font-size:18px;
    cursor:pointer;
}

.nav-icons i:hover{
    color:#ccc;
}
</style>
<link rel="stylesheet" href="style.css">

<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="top-bar">
    EXTRA 5% OFF AND FREE SHIPPING ON ALL ONLINE PAYMENTS*
</div>

<nav class="navbar">

    <div class="logo">
        <img src="puma-logo.png" alt="logo">
    </div>

    <ul class="nav-links">
        <li><a href="#">New</a></li>
        <li><a href="#">Sports</a></li>
        <li><a href="#">Men</a></li>
        <li><a href="#">Women</a></li>
        <li><a href="#">Motorsport</a></li>
        <li><a href="#">Lifestyle</a></li>
        <li><a href="#">Kids</a></li>
        <li><a href="#">Sale</a></li>
    </ul>

    <div class="nav-icons">
        <i class="fa fa-search"></i>
        <i class="fa fa-heart"></i>
        <i class="fa fa-shopping-cart"></i>
        <i class="fa fa-user"></i>
    </div>

</nav>

</body>
</html>
